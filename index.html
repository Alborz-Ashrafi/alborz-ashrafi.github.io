<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alborz Ashrafi</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #181818;
    }

    main {
      width: min(600px, calc(100% - 48px));
      padding: 48px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.9;
      color: #555;
    }
  </style>
</head>

<body>
  <main>
    <h1>البرز اشرفی</h1>
    <p>
      وب‌سایت شخصی من در حال آماده‌سازی است.
    </p>
  </main>
</body>
</html>
